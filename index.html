<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css"/>
    <title>Weather app</title>
    <script src="./script.js" type="text/JavaScript" defer></script>
</head>
<body>
  <h1>Weather App</h1>
  <div class="container">
    <div class="search">
      <input type="text" id="cityInput">
      <button id="searchbtn" type="button">
         <img src="./images/search.png" alt="">
      </button>
    </div>
     <div class="city">
          <img id="weatherIcon" src="" alt="">
          <p id="temperature"></p>
          <p id="cityname"></p>

          <div class="details">
              <div class="humidity">
                 <img id="humidityIcon" src="./images/humidity.png" alt="">
                 <p id="humpercent"></p>
                 <p>Humidity</p>
              </div>
             
               <div class="wind">
                  <img id="windIcon" src="./images/wind.png" alt="">
                  <p id="windpercent"></p>
                  <p>Wind Speed</p>
               </div>
              

          </div>
          

     </div>
  </div>
    
    


</body>
</html>
